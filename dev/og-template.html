<!doctype html>
<!-- The social preview for wolfgang-linz.de/klecks/. Rendered at 1200 × 630 from the website's klecks/ folder. -->
<html lang="de"><head><meta charset="utf-8">
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #0b0912; color: #f5f3fa; font-family: Geist, sans-serif; }
.b { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .55; }
.b1 { left: -120px; top: -80px; width: 520px; height: 420px; background: #ff8a4c; opacity: .4; }
.b2 { right: -160px; top: -120px; width: 620px; height: 520px; background: #8b5cf6; }
.b3 { left: 380px; bottom: -260px; width: 640px; height: 420px; background: #ff3d7f; opacity: .45; }
.copy { position: absolute; left: 70px; top: 0; bottom: 0; width: 470px; display: flex; flex-direction: column; justify-content: center; }
.brand { display: flex; align-items: center; gap: 14px; font-weight: 650; font-size: 30px; letter-spacing: -.02em; }
h1 { margin: 34px 0 0; font-weight: 700; font-size: 84px; line-height: .96; letter-spacing: -.055em; }
em { font-family: 'Instrument Serif', serif; font-weight: 400; font-style: italic; font-size: 1.1em; letter-spacing: -.02em; background: linear-gradient(100deg, #ff8a4c, #ff3d7f 48%, #8b5cf6); -webkit-background-clip: text; color: transparent; padding-right: .05em; }
p { margin: 26px 0 0; font-size: 23px; line-height: 1.4; color: #b9b5c8; }
.shot { position: absolute; left: 556px; top: 118px; width: 600px; padding: 28px; border-radius: 22px; background: linear-gradient(135deg, #6D4AFF, #FF4D8D, #FFA24C); transform: rotate(-4deg); box-shadow: 0 40px 90px -20px rgba(0,0,0,.8); }
.shot div { position: relative; }
.shot img { display: block; width: 100%; border-radius: 10px; box-shadow: 0 18px 40px -10px rgba(0,0,0,.5); }
.shot svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
canvas { position: absolute; image-rendering: pixelated; }
</style></head><body>
<i class="b b1"></i><i class="b b2"></i><i class="b b3"></i>
<div class="copy">
  <div class="brand"><img src="assets/klecks-icon.svg" width="54" height="54" alt="">Klecks</div>
  <h1>Paint,<br><em>neu gedacht.</em></h1>
  <p>Das moderne Paint für macOS und Windows. Mit Pfeilen, Nummern und Verpixeln für Screenshots.</p>
</div>
<div class="shot"><div>
  <img id="im" src="demo/demo/screen.png" alt="">
  <canvas id="c1" width="202" height="26" style="left:28.667%;top:37.895%;width:16.833%;height:3.421%"></canvas>
  <canvas id="c2" width="242" height="32" style="left:24.75%;top:59.08%;width:20.167%;height:4.21%"></canvas>
  <svg viewBox="0 0 1200 760">
    <rect x="740" y="453" width="246" height="27" rx="3" fill="#ffe14d" opacity=".75" style="mix-blend-mode:multiply"/>
    <g font-family="Geist" font-weight="700" font-size="22" text-anchor="middle" dominant-baseline="middle" fill="#fff">
      <circle cx="190" cy="325" r="22" fill="#ff3b30" stroke="#fff" stroke-width="3.5"/><text x="190" y="326">1</text>
      <circle cx="1008" cy="307" r="22" fill="#ff3b30" stroke="#fff" stroke-width="3.5"/><text x="1008" y="308">2</text>
    </g>
    <path d="M880 118 Q1092 118 1086 262" fill="none" stroke="#ff3b30" stroke-width="9" stroke-linecap="round"/>
    <path d="M1086 290 L1064 254 L1108 254 Z" fill="#ff3b30" stroke="#ff3b30" stroke-width="4" stroke-linejoin="round"/>
  </svg>
</div></div>
<script>
const im = document.getElementById('im');
im.onload = () => [['c1', 344, 288, 202, 26], ['c2', 297, 449, 242, 32]].forEach(([id, x, y, w, h]) => {
  const c = document.getElementById(id), t = document.createElement('canvas'), b = 9;
  t.width = Math.ceil(w / b); t.height = Math.ceil(h / b);
  t.getContext('2d').drawImage(im, x, y, w, h, 0, 0, t.width, t.height);
  const cx = c.getContext('2d'); cx.imageSmoothingEnabled = false;
  cx.drawImage(t, 0, 0, t.width, t.height, 0, 0, t.width * b, t.height * b);
});
</script>
</body></html>
